# Serve the Flutter admin dashboard from the same host as the API (http://134.209.2.225).
# API routes are proxied to the Express backend; everything else is the Flutter SPA.
#
#   flutter build web --release
#   sudo mkdir -p /var/www/bimo-dashboard
#   sudo cp -r build/web/* /var/www/bimo-dashboard/
#   sudo cp deploy/nginx-dashboard.conf /etc/nginx/sites-available/bimo-dashboard
#   sudo ln -sf /etc/nginx/sites-available/bimo-dashboard /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Or run: .\scripts\deploy_droplet.ps1

upstream bimo_api {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name 134.209.2.225;

    root /var/www/bimo-dashboard;
    index index.html;
    client_max_body_size 100M;

    # Backend REST + uploads (same paths the dashboard calls on http://134.209.2.225)
    location ~ ^/(auth|settings|users|posts|uploads|notifications|auctions|categories|chats|gifts|wallets|reports|analytics|promotions|sounds|filters|stories|videos|admin|swagger|api-docs|health|socket\.io) {
        proxy_pass http://bimo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|json|wasm)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
