# HTTPS API for Firebase Hosting (no Cloud Functions / Blaze required).
#
# Domain 134-209-2-225.sslip.io resolves to 134.209.2.225 automatically.
# CORS for https://bomibondapp.web.app is already enabled in the Express app.
#
# Setup on the droplet (once):
#   sudo apt update && sudo apt install -y certbot python3-certbot-nginx
#   sudo cp deploy/nginx-api-https.conf /etc/nginx/sites-available/bimo-api-https
#   sudo ln -sf /etc/nginx/sites-available/bimo-api-https /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d 134-209-2-225.sslip.io --non-interactive --agree-tos -m admin@example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Or run: bash scripts/setup_droplet_https.sh

server {
    listen 80;
    server_name 134-209-2-225.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name 134-209-2-225.sslip.io;

    # certbot fills these paths after the first successful run
    ssl_certificate /etc/letsencrypt/live/134-209-2-225.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/134-209-2-225.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
