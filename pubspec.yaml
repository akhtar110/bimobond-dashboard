name: bimo_bond_dashboard
description: "Mobile Flutter admin dashboard for short-video app."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.0.3
  fl_chart: ^0.68.0
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  change_app_package_name: ^1.5.0
  dio: ^5.9.2
  device_info_plus: ^13.1.0
  package_info_plus: ^10.1.0
  flutter_secure_storage: ^10.2.0
  video_player: ^2.11.1
  video_thumbnail: ^0.5.6
  path_provider: ^2.1.5
  socket_io_client: ^3.0.0
  flutter_map: 8.3.0
  latlong2: 0.9.1
  shared_preferences: ^2.5.5
  geolocator: ^14.0.3
  lottie: ^3.3.3
  archive: ^4.0.0
  pdf: ^3.11.3
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  flutter_colorpicker: ^1.1.0
  flutter_svg: ^2.3.0
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: false

  uses-material-design: true
  assets:
    - lib/core/localization/app_en.arb
    - lib/core/localization/app_ar.arb
    - assets/images/google.png
    - assets/images/auth_illustration.png
    - assets/images/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/Fonts/english_fonts/Montserrat-Thin.ttf
          weight: 100
        - asset: assets/Fonts/english_fonts/Montserrat-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/Fonts/english_fonts/Montserrat-ExtraLight.ttf
          weight: 200
        - asset: assets/Fonts/english_fonts/Montserrat-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/Fonts/english_fonts/Montserrat-Light.ttf
          weight: 300
        - asset: assets/Fonts/english_fonts/Montserrat-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/Fonts/english_fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/Fonts/english_fonts/Montserrat-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/Fonts/english_fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/Fonts/english_fonts/Montserrat-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/Fonts/english_fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/Fonts/english_fonts/Montserrat-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/Fonts/english_fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/Fonts/english_fonts/Montserrat-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/Fonts/english_fonts/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/Fonts/english_fonts/Montserrat-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/Fonts/english_fonts/Montserrat-Black.ttf
          weight: 900
        - asset: assets/Fonts/english_fonts/Montserrat-BlackItalic.ttf
          weight: 900
          style: italic
    - family: Jannat
      fonts:
        - asset: assets/Fonts/arabic_fonts/jannat-1.TTF
          weight: 400
        - asset: assets/Fonts/arabic_fonts/jannat-2.TTF
          weight: 700
